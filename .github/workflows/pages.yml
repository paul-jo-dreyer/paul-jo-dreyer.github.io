name: Deploy site to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

# Allow this workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let an in-progress deploy finish
# (don't cancel it) so a live publish is never interrupted mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The Jekyll Gemfile lives in site/, not the repo root.
      BUNDLE_GEMFILE: ${{ github.workspace }}/site/Gemfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true # bundle install + cache, keyed off site/Gemfile.lock

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        # Bookshop components are rendered by the jekyll-bookshop gem; no npm
        # step is needed for a static build. component-library is resolved
        # via bookshop_locations: ../component-library in site/_config.yml.
        run: bundle exec jekyll build --source site --destination _site --trace

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
